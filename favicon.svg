<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="32" height="32" fill="#0A0A14"/>
  <!-- T-tetromino — 3 wide × 2 tall, block=7px gap=1px, centred in 32×32 -->
  <g fill="#A000F0" filter="url(#glow)">
    <!-- Top row (3 wide) -->
    <rect x="4.5"  y="8.5" width="7" height="7"/>
    <rect x="12.5" y="8.5" width="7" height="7"/>
    <rect x="20.5" y="8.5" width="7" height="7"/>
    <!-- Centre block below -->
    <rect x="12.5" y="16.5" width="7" height="7"/>
  </g>
</svg>
