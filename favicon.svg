<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="32" height="32" fill="#0A0A14"/>
  <!-- T shape — cyan I-piece, 5 blocks wide × 5 blocks tall, block=4px gap=2px -->
  <g fill="#00F0F0" filter="url(#glow)">
    <!-- Top bar -->
    <rect x="2"  y="2" width="4" height="4"/>
    <rect x="8"  y="2" width="4" height="4"/>
    <rect x="14" y="2" width="4" height="4"/>
    <rect x="20" y="2" width="4" height="4"/>
    <rect x="26" y="2" width="4" height="4"/>
    <!-- Stem (centre column) -->
    <rect x="14" y="8"  width="4" height="4"/>
    <rect x="14" y="14" width="4" height="4"/>
    <rect x="14" y="20" width="4" height="4"/>
    <rect x="14" y="26" width="4" height="4"/>
  </g>
</svg>
