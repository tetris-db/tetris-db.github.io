<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="32" height="32" fill="#0A0A14"/>
  <!-- T shape — 3 wide × 4 tall, block=5px gap=1px, centred in 32×32 -->
  <g fill="#00F0F0" filter="url(#glow)">
    <!-- Top bar (3 wide) -->
    <rect x="7.5"  y="4.5" width="5" height="5"/>
    <rect x="13.5" y="4.5" width="5" height="5"/>
    <rect x="19.5" y="4.5" width="5" height="5"/>
    <!-- Stem (centre column, rows 2–4) -->
    <rect x="13.5" y="10.5" width="5" height="5"/>
    <rect x="13.5" y="16.5" width="5" height="5"/>
    <rect x="13.5" y="22.5" width="5" height="5"/>
  </g>
</svg>
