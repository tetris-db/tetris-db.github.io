<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="32" height="32" fill="#0A0A14"/>
  <!-- T shape — 3 wide × 4 tall, block=3px gap=1px, centred in 32×32 -->
  <g fill="#00F0F0" filter="url(#glow)">
    <!-- Top bar (3 wide) -->
    <rect x="10.5" y="8.5" width="3" height="3"/>
    <rect x="14.5" y="8.5" width="3" height="3"/>
    <rect x="18.5" y="8.5" width="3" height="3"/>
    <!-- Stem (centre column, rows 2–4) -->
    <rect x="14.5" y="12.5" width="3" height="3"/>
    <rect x="14.5" y="16.5" width="3" height="3"/>
    <rect x="14.5" y="20.5" width="3" height="3"/>
  </g>
</svg>
